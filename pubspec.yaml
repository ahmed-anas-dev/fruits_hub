name: fruits_hub
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # باقات الترجمة والـ Localization
  intl: ^0.20.2

  # باقات التصميم والواجهات
  flutter_svg: ^2.3.0
  dots_indicator: ^4.0.1
  modal_progress_hud_nsn: ^0.5.1
  skeletonizer: ^2.1.3
  flutter_launcher_icons: ^0.14.4

  # باقات إدارة الحالة وقاعدة البيانات
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  dartz: ^0.10.1
  shared_preferences: ^2.5.5

  # باقات الفايربيز وتأسيس الحسابات
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  google_sign_in: ^6.3.0
  # NOTE: keep version in sync with plugin channel implementation
  flutter_facebook_auth: ^7.1.2
  cloud_firestore: ^6.4.1
  flutter_svg_provider: ^1.0.7
  equatable: ^2.0.8
  provider: ^6.1.5+1
  
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_intl:
  enabled: true
  dev_dependencies:
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
 android: "launcher_icon"
 ios: true
 image_path: "assets/images/s.png"
 min_sdk_android: 21 # android min sdk min:16, default 21
  